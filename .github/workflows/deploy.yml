# Argus → Dokploy. Tests → buildx (GHCR: api, worker, prompt-eval, stream-prep,
# stream-gateway-sync, edge-cv; `production` + `<sha>` tags) → runner compose
# smoke (migrate one-shot against throwaway Postgres/MinIO, api healthy) →
# deploy webhook → poll /version == released SHA. Rollback = workflow_dispatch
# with the previous sha (operator may set SKIP_MIGRATIONS=1 in the panel —
# see deploy/README.md).
name: Deploy (Dokploy)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: false
        description: Full commit SHA to release/roll back (empty = current main)
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-argus
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT}"
          case "$sha" in
            [0-9a-f]*) ;;
            *) echo "::error::invalid sha: $sha"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: API tests (DB-free CI subset — compose contract + HTTP surface)
        run: |
          set -euo pipefail
          python -m pip install --quiet -r apps/api/requirements.txt pytest pytest-asyncio
          (cd apps/api && PYTHONPATH=src python -m pytest tests/test_http_cors.py tests/test_compose_contract.py tests/test_version_route.py -q)
      - name: stream-prep tests (no DB required)
        working-directory: services/stream-prep
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt pytest
          PYTHONPATH=src python -m pytest tests -q
      - name: prompt-eval tests (no DB required)
        working-directory: services/prompt-eval
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt pytest pytest-asyncio
          PYTHONPATH="src:../../apps/api/src" python -m pytest tests -q

  images:
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: api.Dockerfile
          - image: prompt-eval
            dockerfile: prompt-eval.Dockerfile
          - image: stream-prep
            dockerfile: stream-prep.Dockerfile
          - image: stream-gateway-sync
            dockerfile: stream-gateway-sync.Dockerfile
          - image: edge-cv
            dockerfile: edge-cv.Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/guilheeeeeeerme/argus/${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/${{ matrix.dockerfile }}
          build-args: GIT_SHA=${{ needs.resolve.outputs.sha }}
          push: true
          tags: |
            ghcr.io/guilheeeeeeerme/argus/${{ matrix.image }}:${{ needs.resolve.outputs.sha }}
            ghcr.io/guilheeeeeeerme/argus/${{ matrix.image }}:production
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  tag-worker:
    needs: [resolve, images]
    runs-on: ubuntu-24.04
    # The `worker` image is a plain re-tag of the api image (same build, the
    # Celery process is only a different compose command) — mirrors
    # infra/scripts/build.sh ("docker tag api worker").
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag (manifest level, no local cache)
        env:
          API: ghcr.io/guilheeeeeeerme/argus/api
          WORKER: ghcr.io/guilheeeeeeerme/argus/worker
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create "$API:$SHA" -t "$WORKER:$SHA"
          docker buildx imagetools create "$API:production" -t "$WORKER:production"

  smoke:
    needs: [resolve, images]
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.resolve.outputs.sha }}
      # Non-secret placeholders so prod compose interpolates; the smoke
      # override swaps DB/Redis/MinIO for throwaway local services.
      REDIS_PASSWORD: smoke-redis-password
      STREAM_GATEWAY_TOKEN: smoke-stream-gateway-token
      GEMINI_API_KEY: smoke-gemini-key
      AUTH0_DOMAIN: dev.argus.local
      DEV_JWT_SECRET: smoke-dev-jwt
      REDIS_URL: redis://:smoke-redis-password@redis:6379/1
      S3_ENDPOINT_URL: http://object-store:3900
      S3_ACCESS_KEY_ID: smoke
      S3_SECRET_ACCESS_KEY: smoke-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Validate compose render
        run: docker compose --env-file deploy/smoke.env -f deploy/compose.prod.yml -f deploy/smoke.compose.yml config -q
      - name: Strict smoke against prod compose (pipeline profile OFF)
        run: |
          set -euo pipefail
          docker compose --env-file deploy/smoke.env -f deploy/compose.prod.yml -f deploy/smoke.compose.yml up -d --wait migrate
          docker compose --env-file deploy/smoke.env -f deploy/compose.prod.yml -f deploy/smoke.compose.yml up -d --wait api worker
      - name: /version equals released SHA
        run: |
          set -euo pipefail
          docker compose --env-file deploy/smoke.env -f deploy/compose.prod.yml -f deploy/smoke.compose.yml \
            exec -T api python -c "import json, urllib.request, sys; served=json.load(urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=5)); expected='${{ needs.resolve.outputs.sha }}'; print(served); sys.exit(0 if served['gitsha'] == expected else 1)"
      - name: Teardown
        if: always()
        run: docker compose --env-file deploy/smoke.env -f deploy/compose.prod.yml -f deploy/smoke.compose.yml down -v --remove-orphans || true

  deploy:
    needs: [resolve, images, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Dokploy deploy hook
        env:
          HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL:-}" ]; then
            echo "::error::DOKPLOY_DEPLOY_HOOK_URL secret is missing"; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK_URL")
          echo "webhook status: $code"
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
      - name: Poll /version == released SHA (up to 5 min)
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          API_URL: ${{ vars.API_PUBLIC_URL || 'https://api.argus.ferredemo.dev' }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$API_URL/version" 2>/dev/null || true)
            if [ -n "$body" ]; then
              echo "served: $body"
              if printf '%s' "$body" | grep -qE "\"gitsha\"[[:space:]]*:[[:space:]]*\"$SHA\""; then
                echo "released SHA $SHA is live"; exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::/version did not report $SHA in time"; exit 1
