name: Notify infra
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    if: vars.INFRA_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Request deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/Guilheeeeeeerme/infra/dispatches \
            -f event_type=deploy \
            -f 'client_payload[project]=argus' \
            -f "client_payload[repository]=$REPOSITORY" \
            -f "client_payload[sha]=$SHA"
