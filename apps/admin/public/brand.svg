  <ellipse cx="16" cy="16" rx="5.2" ry="3.4" fill="#0E7490"/>
  <circle cx="16" cy="16" r="1.7" fill="#ECFEFF"/>
  <!-- satellite eyes -->
  <ellipse cx="16" cy="6.8" rx="3.2" ry="2.1" fill="#155E75"/>
  <circle cx="16" cy="6.8" r="1" fill="#A5F3FC"/>
