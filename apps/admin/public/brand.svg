  <circle cx="16" cy="25.2" r="1" fill="#A5F3FC"/>
  <ellipse cx="6.8" cy="16" rx="2.1" ry="3.2" fill="#155E75"/>
  <circle cx="6.8" cy="16" r="1" fill="#A5F3FC"/>
  <ellipse cx="25.2" cy="16" rx="2.1" ry="3.2" fill="#155E75"/>
  <circle cx="25.2" cy="16" r="1" fill="#A5F3FC"/>
  <ellipse cx="9.2" cy="9.2" rx="2.4" ry="1.7" transform="rotate(-40 9.2 9.2)" fill="#0F766E"/>
  <circle cx="9.2" cy="9.2" r="0.85" fill="#CCFBF1"/>
  <ellipse cx="22.8" cy="9.2" rx="2.4" ry="1.7" transform="rotate(40 22.8 9.2)" fill="#0F766E"/>
