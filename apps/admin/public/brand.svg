  <ellipse cx="9.2" cy="22.8" rx="2.4" ry="1.7" transform="rotate(40 9.2 22.8)" fill="#0F766E"/>
  <circle cx="9.2" cy="22.8" r="0.85" fill="#CCFBF1"/>
  <ellipse cx="22.8" cy="22.8" rx="2.4" ry="1.7" transform="rotate(-40 22.8 22.8)" fill="#0F766E"/>
  <circle cx="22.8" cy="22.8" r="0.85" fill="#CCFBF1"/>
