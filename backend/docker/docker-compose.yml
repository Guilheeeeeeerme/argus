x-argus-env: &argus-env
  DATABASE_URL: postgresql+asyncpg://argus_app:argus_app@postgres:5432/argus
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET_NAME: argus-frames
  S3_REGION: us-east-1
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-placeholder.auth0.com}
  AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE:-https://api.argus.local}
  AUTH0_ALGORITHMS: ${AUTH0_ALGORITHMS:-HS256}
  AUTH0_USE_MOCK: ${AUTH0_USE_MOCK:-true}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-local-development-secret}
  NOTIFICATION_MODE: ${NOTIFICATION_MODE:-log}
  DEV_NOTIFY_FAIL: ${DEV_NOTIFY_FAIL:-false}
  EVENT_TRANSPORT: ${EVENT_TRANSPORT:-log}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
  EVENTBRIDGE_BUS_NAME: ${EVENTBRIDGE_BUS_NAME:-default}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  API_HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-argus-build: &argus-build
  context: ..
  dockerfile: docker/Dockerfile
  network: host

x-argus-env-file: &argus-env-file
  - ../../.env

services:
  # ── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - argus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: argus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - argus_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: argus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/argus-frames --ignore-existing &&
      mc anonymous set download local/argus-frames &&
      echo 'MinIO bucket argus-frames ready'
      "
    restart: "no"

  # ── HTTP deployables ───────────────────────────────────────────────────────

  api-admin:
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: api-admin
    container_name: argus-api-admin
    environment:
      <<: *argus-env
      SERVICE_ROLE: api-admin
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-ingest:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: api-ingest
    container_name: argus-api-ingest
    environment:
      <<: *argus-env
      SERVICE_ROLE: api-ingest
      API_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ws-gateway:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: ws-gateway
    container_name: argus-ws-gateway
    environment:
      <<: *argus-env
      SERVICE_ROLE: ws-gateway
      API_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Worker deployables ─────────────────────────────────────────────────────

  worker-vlm:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: worker
    container_name: argus-worker-vlm
    environment:
      <<: *argus-env
      SERVICE_ROLE: worker-vlm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-aggregator:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: worker
    container_name: argus-worker-aggregator
    environment:
      <<: *argus-env
      SERVICE_ROLE: worker-aggregator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-notify:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: worker
    container_name: argus-worker-notify
    environment:
      <<: *argus-env
      SERVICE_ROLE: worker-notify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-scheduler:
    profiles: [platform]
    env_file: *argus-env-file
    build:
      <<: *argus-build
      target: worker
    container_name: argus-worker-scheduler
    environment:
      <<: *argus-env
      SERVICE_ROLE: worker-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ../../apps/core-admin/web
      dockerfile: Dockerfile
      network: host
    container_name: argus-admin-dashboard
    volumes:
      - ../../frontend/admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      VITE_ADMIN_API: ${VITE_ADMIN_API:-https://api.development.argus.com}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      api-admin:
        condition: service_healthy

  triage-spa:
    profiles: [mfe]
    build:
      context: ../../apps/mfes/triage
      dockerfile: Dockerfile
      network: host
    container_name: argus-triage-spa
    volumes:
      - ../../frontend/triage:/app
      - triage_node_modules:/app/node_modules
    environment:
      VITE_ADMIN_API: ${VITE_ADMIN_API:-https://api.development.argus.com}
      VITE_WS_API: ${VITE_WS_API:-wss://ws.development.argus.com}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"
    depends_on:
      api-admin:
        condition: service_healthy
      ws-gateway:
        condition: service_healthy

  dev-gateway:
    image: caddy:2-alpine
    container_name: argus-dev-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin-dashboard:
        condition: service_started
      api-admin:
        condition: service_healthy

volumes:
  argus_postgres_data:
  argus_redis_data:
  argus_minio_data:
  admin_node_modules:
  triage_node_modules:
  caddy_data:
  caddy_config:
