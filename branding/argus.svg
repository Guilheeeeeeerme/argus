<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Argus">
  <!-- Many-eyed watcher: geometric vigilance mark (original; not derived from Wikimedia art) -->
  <defs>
    <radialGradient id="argus-core" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#164E63"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#argus-core)"/>
  <!-- outer vigilance ring -->
  <circle cx="16" cy="16" r="12.2" fill="none" stroke="#1F2A3D" stroke-width="1.25"/>
  <circle cx="16" cy="16" r="9.6" fill="none" stroke="#155E75" stroke-width="0.75" opacity="0.85"/>
  <!-- central eye -->
  <ellipse cx="16" cy="16" rx="5.4" ry="3.5" fill="#0E7490"/>
  <circle cx="16" cy="16" r="1.85" fill="#ECFEFF"/>
  <circle cx="16.55" cy="15.45" r="0.45" fill="#0B1220" opacity="0.35"/>
  <!-- cardinal satellite eyes -->
  <ellipse cx="16" cy="6.4" rx="3.1" ry="2.05" fill="#155E75"/>
  <circle cx="16" cy="6.4" r="1" fill="#A5F3FC"/>
  <ellipse cx="16" cy="25.6" rx="3.1" ry="2.05" fill="#155E75"/>
  <circle cx="16" cy="25.6" r="1" fill="#A5F3FC"/>
  <ellipse cx="6.4" cy="16" rx="2.05" ry="3.1" fill="#155E75"/>
  <circle cx="6.4" cy="16" r="1" fill="#A5F3FC"/>
  <ellipse cx="25.6" cy="16" rx="2.05" ry="3.1" fill="#155E75"/>
  <circle cx="25.6" cy="16" r="1" fill="#A5F3FC"/>
  <!-- diagonal satellite eyes -->
  <ellipse cx="9.1" cy="9.1" rx="2.35" ry="1.65" transform="rotate(-40 9.1 9.1)" fill="#0F766E"/>
  <circle cx="9.1" cy="9.1" r="0.85" fill="#CCFBF1"/>
  <ellipse cx="22.9" cy="9.1" rx="2.35" ry="1.65" transform="rotate(40 22.9 9.1)" fill="#0F766E"/>
  <circle cx="22.9" cy="9.1" r="0.85" fill="#CCFBF1"/>
  <ellipse cx="9.1" cy="22.9" rx="2.35" ry="1.65" transform="rotate(40 9.1 22.9)" fill="#0F766E"/>
  <circle cx="9.1" cy="22.9" r="0.85" fill="#CCFBF1"/>
  <ellipse cx="22.9" cy="22.9" rx="2.35" ry="1.65" transform="rotate(-40 22.9 22.9)" fill="#0F766E"/>
  <circle cx="22.9" cy="22.9" r="0.85" fill="#CCFBF1"/>
</svg>
