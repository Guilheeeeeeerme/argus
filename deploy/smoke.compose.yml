# Runner smoke override (GitHub Actions only — never deployed anywhere).
# Boots the production compose against throwaway local Postgres (pgvector) +
# MinIO so the migrate → api chain is exercised end to end without any secret.
# Requires Compose >= 2.24 for the `!override` tag.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [argus-internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [argus-internal]

  minio-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/argus-frames --ignore-existing"
    depends_on:
      minio:
        condition: service_healthy
    networks: [argus-internal]

  migrate:
    environment: !override
      SKIP_MIGRATIONS: "0"
      ADMIN_DATABASE_URL: postgresql+asyncpg://argus:argus@postgres:5432/argus
      ARGUS_APP_ROLE_PASSWORD: argus_app
      DEV_ROOT_EMAIL: root@argus.local
      DEV_ROOT_PASSWORD: Password123!
      SEED_DEMO: "0"
      LOG_LEVEL: INFO
    depends_on: !override
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    environment: !override
      GIT_SHA: smoke
      SERVICE_ROLE: api-admin
      DATABASE_URL: postgresql+asyncpg://argus_app:argus_app@postgres:5432/argus
      ADMIN_DATABASE_URL: postgresql+asyncpg://argus:argus@postgres:5432/argus
      REDIS_URL: redis://:smoke-password@redis:6379/0
      AUTH0_USE_MOCK: "true"
      AUTH0_DOMAIN: dev.argus.local
      DEV_JWT_SECRET: smoke-dev-jwt
      STREAM_GATEWAY_TOKEN: smoke-stream-gateway-token
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: argus-frames
      CORS_ORIGINS: http://localhost:8180
      LOG_LEVEL: INFO
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    environment: !override
      SERVICE_ROLE: worker-vlm
      DATABASE_URL: postgresql+asyncpg://argus_app:argus_app@postgres:5432/argus
      REDIS_URL: redis://:smoke-password@redis:6379/0
      LOG_LEVEL: INFO
