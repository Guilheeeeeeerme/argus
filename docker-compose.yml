name: argus

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://argus_app:argus_app@postgres:5432/argus
  ADMIN_DATABASE_URL: postgresql+asyncpg://argus:argus@postgres:5432/argus
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
  AUTH0_USE_MOCK: ${AUTH0_USE_MOCK:-true}
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev.local}
  AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE:-http://localhost:8800}
  AUTH0_CLAIMS_NAMESPACE: ${AUTH0_CLAIMS_NAMESPACE:-http://argus.local}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-local-dev-secret-change-me}
  TRIAGE_PUBLIC_ORIGIN: ${TRIAGE_PUBLIC_ORIGIN:-http://localhost:8181}
  API_HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
  LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,openai}
  MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
  MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
  LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
  LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
  NOTIFICATION_MODE: log
  EVENT_TRANSPORT: log
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET_NAME: argus-frames
  S3_REGION: us-east-1

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes: ["argus_postgres_data:/var/lib/postgresql/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    command: redis-server --appendonly yes
    volumes: ["argus_redis_data:/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: argus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["argus_minio_data:/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: argus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/argus-frames --ignore-existing &&
      mc anonymous set download local/argus-frames &&
      echo 'MinIO bucket argus-frames ready'
      "
    networks: [argus_dmz]
    restart: "no"

  api:
    build:
      context: ./apps/api
      network: host
    container_name: argus-api
    environment:
      <<: *api-env
      SERVICE_ROLE: api-admin
    ports: ["8800:8000"]
    volumes:
      - ./apps/api:/app
    command:
      - sh
      - /app/docker-entrypoint.sh
      - uvicorn
      - argus.apps.http:create_admin_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    networks: [argus_dmz]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/api
      network: host
    container_name: argus-worker
    environment:
      <<: *api-env
      SERVICE_ROLE: worker-vlm
    volumes: ["./apps/api:/app"]
    command:
      - celery
      - -A
      - argus.workers.celery_app
      - worker
      - --beat
      - --loglevel=INFO
    networks: [argus_dmz]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  admin:
    build:
      context: ./apps/admin
      network: host
    container_name: argus-admin
    environment:
      VITE_API_BASE: /api
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8180}
      VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8181}
      VITE_SSO_RETURN_ORIGINS: ${VITE_SSO_RETURN_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
    ports: ["8180:8180"]
    volumes:
      # Vite aliases resolve ../../packages and ../shared from /app (= apps/admin).
      - ./apps/admin:/app
      - ./packages:/packages
      - ./apps/shared:/shared
      - admin_node_modules:/app/node_modules
    networks: [argus_dmz]
    depends_on:
      - api

  triage:
    build:
      context: ./apps/triage
      network: host
    container_name: argus-triage
    environment:
      VITE_API_BASE: /api
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8180}
      VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8181}
      VITE_SSO_RETURN_ORIGINS: ${VITE_SSO_RETURN_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
    ports: ["8181:8181"]
    volumes:
      - ./apps/triage:/app
      - ./packages:/packages
      - ./apps/shared:/shared
      - triage_node_modules:/app/node_modules
    networks: [argus_dmz]
    depends_on:
      - api

volumes:
  argus_postgres_data:
  argus_redis_data:
  argus_minio_data:
  admin_node_modules:
  triage_node_modules:

networks:
  argus_dmz:
    name: argus_dmz
