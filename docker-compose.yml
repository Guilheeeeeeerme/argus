name: argus

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://argus_app:argus_app@postgres:5432/argus
  ADMIN_DATABASE_URL: postgresql+asyncpg://argus:argus@postgres:5432/argus
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
  AUTH0_USE_MOCK: ${AUTH0_USE_MOCK:-true}
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev.local}
  AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE:-http://localhost:8800}
  AUTH0_CLAIMS_NAMESPACE: ${AUTH0_CLAIMS_NAMESPACE:-http://argus.local}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-local-dev-secret-change-me}
  TRIAGE_PUBLIC_ORIGIN: ${TRIAGE_PUBLIC_ORIGIN:-http://localhost:8181}
  API_HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
  LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,openai}
  MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
  MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
  LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
  LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
  NOTIFICATION_MODE: log
  EVENT_TRANSPORT: log
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET_NAME: argus-frames
  S3_REGION: us-east-1
  DEV_ROOT_EMAIL: ${DEV_ROOT_EMAIL:-root@argus.local}
  DEV_ROOT_PASSWORD: ${DEV_ROOT_PASSWORD:-Password123!}
  SEED_DEMO: ${SEED_DEMO:-1}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-Password123!}
  STREAM_GATEWAY_TOKEN: ${STREAM_GATEWAY_TOKEN:-dev-stream-gateway-token}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes: ["argus_postgres_data:/var/lib/postgresql/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    command: redis-server --appendonly yes
    volumes: ["argus_redis_data:/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: argus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["argus_minio_data:/data"]
    networks: [argus_dmz]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: argus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/argus-frames --ignore-existing &&
      echo 'MinIO bucket argus-frames ready (private; worker uses credentials)'
      "
    networks: [argus_dmz]
    restart: "no"

  api:
    build:
      context: ./apps/api
      network: host
    container_name: argus-api
    environment:
      <<: *api-env
      SERVICE_ROLE: api-admin
    ports: ["8800:8000"]
    volumes:
      - ./apps/api:/app
    command:
      - sh
      - /app/docker-entrypoint.sh
      - uvicorn
      - argus.apps.http:create_admin_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    networks: [argus_dmz]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  prompt-eval:
    build:
      context: .
      dockerfile: services/prompt-eval/Dockerfile
      network: host
    container_name: argus-prompt-eval
    environment:
      <<: *api-env
      MAX_CLIP_SECONDS: ${MAX_CLIP_SECONDS:-600}
      CONTEXT_LOOKBACK_SECONDS: ${CONTEXT_LOOKBACK_SECONDS:-900}
      PROMPT_EVAL_CONFIDENCE_FLOOR: ${PROMPT_EVAL_CONFIDENCE_FLOOR:-0.5}
      FRAMES_READY_STREAM: frames:ready
      FRAMES_READY_GROUP: prompt-eval
      CONTEXT_EVENTS_STREAM: context:events
      CONTEXT_EVENTS_GROUP: prompt-eval
      DETECTIONS_POSITIVE_STREAM: detections:positive
    volumes:
      - ./services/prompt-eval/src/argus_prompt_eval:/app/argus_prompt_eval
      - ./apps/api/src/argus:/app/argus
    networks: [argus_dmz]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      network: host
    container_name: argus-admin
    environment:
      VITE_API_BASE: /api
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8180}
      VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8181}
      VITE_SSO_RETURN_ORIGINS: ${VITE_SSO_RETURN_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
    ports: ["8180:8180"]
    volumes:
      # Vite aliases resolve ../../packages and ../shared from /app (= apps/admin).
      - ./apps/admin:/app
      - ./packages:/packages
      - ./apps/shared:/shared
      - admin_node_modules:/app/node_modules
    networks: [argus_dmz]
    depends_on:
      - api

  triage:
    build:
      context: ./apps/triage
      network: host
    container_name: argus-triage
    environment:
      VITE_API_BASE: /api
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8180}
      VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8181}
      VITE_SSO_RETURN_ORIGINS: ${VITE_SSO_RETURN_ORIGINS:-http://localhost:8180,http://localhost:8181,http://127.0.0.1:8180,http://127.0.0.1:8181}
    ports: ["8181:8181"]
    volumes:
      - ./apps/triage:/app
      - ./packages:/packages
      - ./apps/shared:/shared
      - triage_node_modules:/app/node_modules
    networks: [argus_dmz]
    depends_on:
      - api

  stream-gateway:
    image: alexxit/go2rtc:latest
    container_name: argus-stream-gateway
    volumes:
      - ./services/stream-gateway/go2rtc.yaml:/config/go2rtc.yaml
    ports:
      - "1984:1984"
      - "8554:8554"
    networks: [argus_dmz]
    restart: unless-stopped

  stream-gateway-sync:
    build:
      context: ./services/stream-gateway
      network: host
    container_name: argus-stream-gateway-sync
    environment:
      API_INTERNAL_URL: http://api:8000
      STREAM_GATEWAY_URL: http://stream-gateway:1984
      STREAM_GATEWAY_TOKEN: ${STREAM_GATEWAY_TOKEN:-dev-stream-gateway-token}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      GO2RTC_CONFIG_PATH: /config/go2rtc.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/stream-gateway/go2rtc.yaml:/config/go2rtc.yaml
    networks: [argus_dmz]
    depends_on:
      - api
      - stream-gateway
    restart: unless-stopped

  stream-prep:
    build:
      context: ./services/stream-prep
      network: host
    container_name: argus-stream-prep
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: argus-frames
      S3_REGION: us-east-1
      API_INTERNAL_URL: http://api:8000
      STREAM_GATEWAY_URL: http://stream-gateway:1984
      STREAM_GATEWAY_TOKEN: ${STREAM_GATEWAY_TOKEN:-dev-stream-gateway-token}
      SAMPLE_FPS: ${SAMPLE_FPS:-1}
      FRAME_TTL: ${FRAME_TTL:-3600}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      WINDOW_SIZE: ${WINDOW_SIZE:-6}
      ALLOW_SYNTHETIC_FRAMES: ${ALLOW_SYNTHETIC_FRAMES:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/stream-prep:/app
    networks: [argus_dmz]
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
      stream-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  argus_postgres_data:
  argus_redis_data:
  argus_minio_data:
  admin_node_modules:
  triage_node_modules:

networks:
  argus_dmz:
    name: argus_dmz
